[project]
name = "drivesense"
version = "0.0.1"
description = "Deep learning driver monitoring system for real-time drowsiness and distraction detection"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
